[package]
name = "dlp"
version = "1.6.0"
edition = "2021"
authors = ["Adam F <adamf>"]
description = "Intelligent orchestration and CLI wrapper for yt-dlp and ffmpeg"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
dirs = "6.0"
inquire = "0.7"
ureq = { version = "2.12", features = ["json"] }
urlencoding = "2.1"
indicatif = "0.17"

[dev-dependencies]
tempfile = "3.17"
