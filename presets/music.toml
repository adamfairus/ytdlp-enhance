# Music / Audio Extraction Preset (v0.5 Specialization)
name = "music"
description = "Extract highest quality native audio (Opus) with 1:1 square cropped album art, clean tags, and standalone LRC lyrics"

container = "opus"
quality = "best"
embed_metadata = true
embed_thumbnail = true
crop_thumbnail_square = true
extract_audio = true
audio_format = "opus"
audio_quality = "0" # Best quality VBR
write_lyrics = true
embed_lyrics = false # Never embed lyrics; generate standalone .lrc file
lyrics_format = "lrc"
clean_metadata = true
parse_music_tags = true
output_template = "%(main_artist,artist,uploader)s/%(album,playlist_title&{}|Single)s/%(title)s.%(ext)s"
